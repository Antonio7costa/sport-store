<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoção | Sport Store Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}?v=2">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
        <h1 class="text-xl font-black uppercase italic text-white mb-1">Promoção</h1>
        <p class="text-xs text-slate-400 mb-5">Aplica um desconto extra por cima do preço normal, sem alterar nenhum valor salvo nas camisas. Desative quando a promoção acabar — tudo volta ao normal na hora.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="bg-emerald-500/10 border border-emerald-500/40 text-emerald-400 text-xs rounded-lg px-3 py-2 mb-4">
                {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="flex items-center gap-2 text-sm font-bold text-white">
                <input type="checkbox" name="promocao_ativa" {% if config.promocao_ativa %}checked{% endif %} class="w-4 h-4 accent-emerald-500">
                Promoção ativa
            </label>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Desconto extra (%)</label>
                <input type="number" step="0.1" min="0" max="100" name="promocao_percentual" value="{{ config.promocao_percentual }}" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Categoria (deixe em branco pra valer no site inteiro)</label>
                <input type="text" name="promocao_categoria" value="{{ config.promocao_categoria or '' }}" placeholder="ex: Brasileiros" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white">
            </div>

            <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black uppercase text-sm py-2.5 rounded-lg transition">
                Salvar
            </button>
        </form>

        <a href="/admin" class="block text-center text-emerald-400 hover:text-white text-xs font-bold uppercase tracking-wider mt-5">← Voltar pro admin</a>
    </div>
</body>
</html>
